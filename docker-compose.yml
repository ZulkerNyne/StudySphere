services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:///data/studysphere.db
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CHROMA_PERSIST_DIR=/data/chroma
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - app-data:/data

volumes:
  app-data:
